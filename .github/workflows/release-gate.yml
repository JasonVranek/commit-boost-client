name: Release Gate
on:
  pull_request:
    types: [closed]
    branches: [main]
    paths: ['.releases/**']

concurrency:
  group: release-gate
  cancel-in-progress: false

jobs:
  create-release-tag:
    name: Create tag and dispatch release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.merged == true
    permissions:
      contents: write
      actions: write
    steps:
      - name: Fail if App credentials are not configured
        run: |
          if [ -z "${{ secrets.APP_ID }}" ] || [ -z "${{ secrets.APP_PRIVATE_KEY }}" ]; then
            echo "❌ APP_ID and APP_PRIVATE_KEY must be configured."
            echo "For fork testing, install a personal GitHub App on the fork,"
            echo "create a private key, and add both as repository secrets."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python deps
        run: pip install pyyaml

      - name: Debug App token permissions
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        continue-on-error: true
        run: |
          echo "================================================"
          echo "1. Token's installation context"
          echo "================================================"
          gh api /installation/repositories --jq '.repositories[].full_name' \
            && echo "✅ Installation lists repos" \
            || echo "❌ FAILED to list installation repos"

          echo ""
          echo "================================================"
          echo "2. Read access to repo refs"
          echo "================================================"
          gh api "/repos/${{ github.repository }}/git/refs/heads/main" --jq '.object.sha' \
            && echo "✅ Can read refs" \
            || echo "❌ FAILED to read refs"

          echo ""
          echo "================================================"
          echo "3. Create a tag object (POST /git/tags)"
          echo "================================================"
          TAG_OBJ=$(gh api -X POST "/repos/${{ github.repository }}/git/tags" \
            -f tag="debug-tag-$(date +%s)" \
            -f message="debug test" \
            -f object="dbefde71d7a145c8ed596f5125f091599f547029" \
            -f type=commit 2>&1) && echo "✅ Tag object created" || echo "❌ FAILED to create tag object: $TAG_OBJ"
          echo "$TAG_OBJ"

          echo ""
          echo "================================================"
          echo "4. Extract SHA from tag object response"
          echo "================================================"
          TAG_SHA=$(echo "$TAG_OBJ" | jq -r '.sha // empty')
          echo "Tag SHA: $TAG_SHA"

          if [ -n "$TAG_SHA" ]; then
            echo ""
            echo "================================================"
            echo "5. Create ref pointing at the tag (POST /git/refs)"
            echo "================================================"
            REF_NAME="debug-ref-$(date +%s)"
            gh api -X POST "/repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/$REF_NAME" \
              -f sha="$TAG_SHA" \
              && echo "✅ Ref created" \
              || echo "❌ FAILED to create ref"
          else
            echo ""
            echo "Skipping ref creation - no tag SHA available"
          fi

          echo ""
          echo "================================================"
          echo "6. Try creating a ref pointing directly at commit (no tag object)"
          echo "================================================"
          gh api -X POST "/repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/debug-direct-$(date +%s)" \
            -f sha="dbefde71d7a145c8ed596f5125f091599f547029" \
            && echo "✅ Direct ref created" \
            || echo "❌ FAILED to create direct ref"

      - name: Create tag from release request
        id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          python .github/workflows/release/release.py gate | tee /tmp/gate-output.txt
          TAG=$(grep '^tag=' /tmp/gate-output.txt | tail -1 | cut -d= -f2-)
          COMMIT=$(grep '^commit=' /tmp/gate-output.txt | tail -1 | cut -d= -f2-)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT

          if [ -z "$TAG" ] || [ -z "$COMMIT" ]; then
            echo "❌ gate did not emit tag= / commit= outputs"
            exit 1
          fi
          echo "Gate outputs: $TAG @ $COMMIT"

      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml \
            --ref main \
            -f tag=${{ steps.gate.outputs.tag }}
